<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Administrar catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#f5f7f8;--ink:#14191d;--mute:#5a666e;--line:#d5dbdf;--blue:#1857d6;--green:#0f8f57;--onb:#fff;--hero:#14191d;--heroink:#f2f5f7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 Barlow,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{background:var(--hero);color:var(--heroink);padding:36px 20px 28px;border-bottom:6px solid var(--green)}
.w{max-width:1040px;margin:0 auto}
h1{font:700 clamp(34px,8vw,60px)/.95 "Barlow Condensed",sans-serif;margin:0 0 10px;letter-spacing:.01em}
header p{margin:0;max-width:46ch;opacity:.85}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 20px}
.chips button{flex:none;font:600 15px Barlow,sans-serif;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--onb)}
main{padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
article{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
article img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--line)}
.b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
h2{font:700 24px/1.05 "Barlow Condensed",sans-serif;margin:0}
.d{color:var(--mute);font-size:15px;margin:0;flex:1}
.p{font:700 34px/1 "Barlow Condensed",sans-serif;color:var(--green);margin-top:6px}
.p small{font:600 14px Barlow,sans-serif;color:var(--mute);margin-left:6px}
a.o{margin-top:8px;text-align:center;text-decoration:none;font-weight:600;padding:12px;border-radius:8px;background:var(--blue);color:var(--onb)}
a.o:focus-visible,.chips button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
footer{padding:8px 20px 40px;color:var(--mute);font-size:14px;text-align:center}

[hidden]{display:none!important}
main{padding-bottom:96px}
.o{display:block;width:100%;margin-top:8px;text-align:center;text-decoration:none;font:600 16px Barlow,sans-serif;padding:12px;border:0;border-radius:8px;background:var(--blue);color:var(--onb);cursor:pointer}
.o:disabled{opacity:.5;cursor:not-allowed}
.o.g{background:var(--green)}
.o.s{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.o:focus-visible,#sheet button:focus-visible,#sheet input:focus-visible,#sheet select:focus-visible,#sheet textarea:focus-visible{outline:3px solid var(--green);outline-offset:2px}
#cartbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
#cartbar .o{margin:0;max-width:560px;margin:0 auto}
#sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px))}
#sheet .w{max-width:560px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.top button{font:600 15px Barlow,sans-serif;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
#items{list-style:none;margin:0;padding:0}
#items li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
#items .ln{display:flex;flex-direction:column}
#items .ln span{color:var(--mute);font-size:14px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 20px Barlow,sans-serif;cursor:pointer}
.tot{display:flex;justify-content:space-between;font:700 28px/1 "Barlow Condensed",sans-serif;margin:16px 0 4px}
#sheet label{display:block;font-weight:600;margin:14px 0 4px}
#sheet input,#sheet select,#sheet textarea{width:100%;font:500 16px Barlow,system-ui,sans-serif;padding:11px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
#sheet small{color:var(--mute)}
.note{color:var(--mute);font-size:14px;margin-top:12px}
.note.err{color:#b00020;font-weight:600;font-size:15px}

body{padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:16px 0}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;font:500 16px Barlow,system-ui,sans-serif;padding:11px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto;margin-right:8px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#list{list-style:none;margin:0;padding:0}
#list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
#list img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:var(--line);flex:none}
#list .ln{flex:1;display:flex;flex-direction:column;min-width:0}
#list .ln span{color:var(--mute);font-size:14px}
button{font:600 15px Barlow,sans-serif;padding:10px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--green);border-color:var(--green);color:#fff}
button.del{color:#b00020;border-color:#b00020}
button:disabled{opacity:.5}
#sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px))}
.note{color:var(--mute);font-size:14px;margin-top:12px}.note.err{color:#b00020;font-weight:600;font-size:15px}
</style></head><body>
<header><div class="w"><h1>Administrar catálogo</h1><p>Cambia precios, añade o elimina productos. Los cambios se ven en el catálogo en 1 o 2 minutos.</p></div></header>
<main><div class="w">
<section id="v1">
<div class="card"><h2>Entrar</h2>
<label for="o">Usuario de GitHub</label><input id="o" autocapitalize="none" autocomplete="off">
<label for="r">Repositorio</label><input id="r" autocapitalize="none" autocomplete="off">
<label for="tk">Llave de acceso</label><input id="tk" type="password" autocomplete="off">
<p class="note">La llave se guarda solo en este navegador. No la compartas con nadie.</p>
<button type="button" class="pri" id="in" style="margin-top:12px">Entrar</button></div>
</section>
<section id="v2" hidden>
<div class="row"><button type="button" class="pri" id="add">+ Añadir producto</button><button type="button" id="out">Cerrar sesión</button></div>
<div class="card"><ul id="list"></ul></div>
<div class="card"><h2>Datos del negocio</h2>
<label for="nom">Nombre del negocio</label><input id="nom">
<label for="wa">WhatsApp que recibe los pedidos <small>(con código de país, sin + ni espacios)</small></label><input id="wa" inputmode="numeric">
<button type="button" class="pri" id="sv" style="margin-top:12px">Guardar datos</button></div>
</section>
<p class="note" id="st" role="status" aria-live="polite"></p>
</div></main>
<div id="sheet" role="dialog" aria-modal="true" aria-label="Producto" hidden><div class="w" style="max-width:560px">
<h2 id="tt">Producto</h2>
<form id="pf"><input type="hidden" name="id">
<label for="pn">Nombre</label><input id="pn" name="n" required>
<label for="pc">Categoría</label><input id="pc" name="c" list="cl" required><datalist id="cl"></datalist>
<label for="pp">Precio (USD)</label><input id="pp" name="p" type="number" min="0" step="any" inputmode="decimal" required>
<label for="pd">Descripción</label><textarea id="pd" name="d" rows="3"></textarea>
<label for="pfoto">Foto <small id="fh"></small></label><input id="pfoto" name="foto" type="file" accept="image/*">
<label><input type="checkbox" name="on" checked> Visible en el catálogo</label>
<p class="note" id="st2" role="status" aria-live="polite"></p>
<div class="row" style="margin-top:16px"><button type="submit" class="pri">Guardar</button><button type="button" id="cx">Cancelar</button><button type="button" class="del" id="dl">Eliminar</button></div>
</form></div></div>
<script>
var TK="",O="",R="",DATA=null,PREV={},EDIT=-1;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function enc(s){return btoa(unescape(encodeURIComponent(s)))}
function dec(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,""))))}
function sv(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
function ld(k){try{return localStorage.getItem(k)||""}catch(e){return ""}}
function msg(t,err){["st","st2"].forEach(function(k){var s=$(k);s.textContent=t;s.className="note"+(err?" err":"")})}
function nice(e){var c=e&&e.status;return c===401?"La llave no es válida o ya venció.":(c===403||c===404)?"Sin permiso, o no se encuentra el repositorio. Revisa la llave y el nombre del repositorio.":(c===409||c===422)?"Hubo un conflicto al guardar. Inténtalo de nuevo.":"No se pudo conectar con GitHub"+(c?" (código "+c+")":"")+". Revisa tu conexión e inténtalo de nuevo."}
function api(m,path,body){return fetch("https://api.github.com/repos/"+O+"/"+R+"/"+path,{method:m,cache:"no-store",headers:{Authorization:"Bearer "+TK,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},body:body?JSON.stringify(body):undefined}).then(function(r){if(r.ok)return r.json();var e=new Error("http");e.status=r.status;throw e})}
function retry(fn,n){return fn().catch(function(e){if(n>0&&e&&(e.status===409||e.status===422||!e.status)){return new Promise(function(r){setTimeout(r,1200)}).then(function(){return retry(fn,n-1)})}throw e})}
function getDoc(){return api("GET","contents/productos.json").then(function(j){return{sha:j.sha,data:JSON.parse(dec(j.content))}})}
function commit(mut,note){return retry(function(){return getDoc().then(function(d){mut(d.data);return api("PUT","contents/productos.json",{message:note,content:enc(JSON.stringify(d.data,null,1)),sha:d.sha}).then(function(){return d.data})})},2)}
function delFile(n){if(!n||n.indexOf("foto-")!==0)return;api("GET","contents/"+encodeURIComponent(n)).then(function(j){return api("DELETE","contents/"+encodeURIComponent(n),{message:"Quitar foto",sha:j.sha})}).catch(function(){})}
function lock(b){Array.prototype.forEach.call(document.querySelectorAll("button"),function(x){x.disabled=b})}
function shrink(file){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var m=900,s=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);var x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);ok(cv.toDataURL("image/jpeg",0.8))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
function view(n){$("v1").hidden=n!==1;$("v2").hidden=n!==2}
function render(){
 DATA.config=DATA.config||{};
 $("nom").value=DATA.config.nombre||"";$("wa").value=DATA.config.whatsapp||"";
 $("list").innerHTML=DATA.productos.map(function(p,i){return '<li><img src="'+esc(PREV[p.id]||p.i)+'" alt=""><div class="ln"><b>'+esc(p.n)+'</b><span>'+esc(p.c)+' · '+esc(p.p)+' USD'+(p.on===false?' · oculto':'')+'</span></div><button type="button" data-e="'+i+'">Editar</button></li>'}).join("")||"<li>No hay productos todavía.</li>";
 var cs=[];DATA.productos.forEach(function(p){if(cs.indexOf(p.c)<0)cs.push(p.c)});
 $("cl").innerHTML=cs.map(function(c){return '<option value="'+esc(c)+'">'}).join("");
}
function enter(){
 msg("Conectando…");lock(true);
 getDoc().then(function(d){DATA=d.data;sv("tk",TK);sv("o",O);sv("r",R);view(2);render();msg("")}).catch(function(e){view(1);msg(nice(e),true)}).then(function(){lock(false)});
}
$("in").onclick=function(){O=$("o").value.trim();R=$("r").value.trim();TK=$("tk").value.trim();if(!O||!R||!TK){msg("Completa los tres campos.",true);return}enter()};
$("out").onclick=function(){sv("tk",null);TK="";$("tk").value="";DATA=null;view(1);msg("Sesión cerrada.")};
$("list").addEventListener("click",function(e){var b=e.target.closest("[data-e]");if(b)openEdit(+b.getAttribute("data-e"))});
$("add").onclick=function(){openEdit(-1)};
function openEdit(i){
 EDIT=i;var f=$("pf"),p=i>=0?DATA.productos[i]:{id:"",n:"",c:"",p:"",d:"",on:true};
 f.elements.id.value=p.id;f.elements.n.value=p.n;f.elements.c.value=p.c;f.elements.p.value=p.p;f.elements.d.value=p.d||"";f.elements.on.checked=p.on!==false;f.elements.foto.value="";
 $("fh").textContent=i>=0?"(opcional: solo si quieres cambiarla)":"(obligatoria)";
 $("tt").textContent=i>=0?"Editar producto":"Nuevo producto";$("dl").hidden=i<0;
 $("sheet").hidden=false;document.body.style.overflow="hidden";$("sheet").scrollTop=0;
}
function closeEdit(){$("sheet").hidden=true;document.body.style.overflow=""}
$("cx").onclick=closeEdit;
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("sheet").hidden)closeEdit()});
$("pf").addEventListener("submit",function(e){
 e.preventDefault();
 var f=e.target,file=f.elements.foto.files[0];
 if(EDIT<0&&!file){msg("Añade una foto del producto.",true);return}
 var id=f.elements.id.value||("p"+Date.now().toString(36)),oldPhoto=EDIT>=0?DATA.productos[EDIT].i:"";
 var item={id:id,n:f.elements.n.value.trim(),c:f.elements.c.value.trim(),p:Number(f.elements.p.value),d:f.elements.d.value.trim(),on:f.elements.on.checked};
 lock(true);msg("Guardando…");
 var step=Promise.resolve("");
 if(file)step=shrink(file).then(function(url){var name="foto-"+id+"-"+Date.now().toString(36)+".jpg";PREV[id]=url;return retry(function(){return api("PUT","contents/"+name,{message:"Foto de producto",content:url.split(",")[1]})},2).then(function(){return name})});
 step.then(function(name){
  return commit(function(d){var k=-1;d.productos.forEach(function(x,j){if(x.id===id)k=j});item.i=name||(k>=0?d.productos[k].i:"");if(k>=0)d.productos[k]=item;else d.productos.push(item)},"Producto: "+item.n).then(function(data){if(name&&oldPhoto)delFile(oldPhoto);return data})
 }).then(function(data){DATA=data;render();closeEdit();msg("Guardado. El catálogo se actualiza en 1 o 2 minutos.")}).catch(function(e){msg(e&&e.status?nice(e):"No se pudo procesar la foto. Prueba con otra.",true)}).then(function(){lock(false)});
});
$("dl").onclick=function(){
 if(EDIT<0||!confirm("¿Eliminar este producto del catálogo?"))return;
 var id=DATA.productos[EDIT].id,ph=DATA.productos[EDIT].i;lock(true);msg("Eliminando…");
 commit(function(d){d.productos=d.productos.filter(function(x){return x.id!==id})},"Eliminar producto").then(function(data){delFile(ph);DATA=data;render();closeEdit();msg("Eliminado. El catálogo se actualiza en 1 o 2 minutos.")}).catch(function(e){msg(nice(e),true)}).then(function(){lock(false)});
};
$("sv").onclick=function(){
 var n=$("nom").value.trim(),w=$("wa").value.replace(/\D/g,"");
 if(!n||w.length<8||w.length>15){msg("Escribe el nombre y un WhatsApp válido, con código de país.",true);return}
 lock(true);msg("Guardando…");
 commit(function(d){d.config=d.config||{};d.config.nombre=n;d.config.whatsapp=w},"Datos del negocio").then(function(data){DATA=data;render();msg("Guardado. El catálogo se actualiza en 1 o 2 minutos.")}).catch(function(e){msg(nice(e),true)}).then(function(){lock(false)});
};
(function(){
 var h=location.hostname.split(".")[0],p=location.pathname.split("/").filter(Boolean)[0]||"";
 if(/github\.io$/.test(location.hostname)){O=ld("o")||h;R=ld("r")||(p&&!/\.html$/.test(p)?p:"")}else{O=ld("o");R=ld("r")}
 $("o").value=O;$("r").value=R;TK=ld("tk");
 if(TK&&O&&R){$("tk").value="";enter()}
})();
</script></body></html>
